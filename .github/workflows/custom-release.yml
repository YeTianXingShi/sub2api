name: Custom Release

on:
  push:
    tags:
      - 'v-custom.[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate tag and source branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v-custom\.[0-9]{8}\.[1-9][0-9]*$ ]]; then
            echo "Invalid custom release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          git fetch origin develop
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/develop
      - name: Audit custom repository references
        run: bash tools/audit-custom-repository.sh

  backend-tests:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  backend-lint:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

  frontend-tests:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint, type check, and critical tests
        run: make test-frontend

  release:
    needs: [backend-tests, backend-lint, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Build embedded frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          archive_version="${GITHUB_REF_NAME#v-}"
          commit="${GITHUB_SHA}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            work="dist/work-${os}-${arch}"
            mkdir -p "$work"
            binary="sub2api"
            if [ "$os" = windows ]; then binary="sub2api.exe"; fi
            (
              cd backend
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -tags=embed -trimpath \
                -ldflags="-s -w -X main.Version=${version} -X main.Commit=${commit} -X main.Date=${built_at} -X main.BuildType=release" \
                -o "../${work}/${binary}" ./cmd/server
            )
            cp LICENSE README.md "$work/"
            archive="sub2api_${archive_version}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$work" && zip -q "../${archive}.zip" sub2api.exe LICENSE README.md)
            else
              tar -C "$work" -czf "dist/${archive}.tar.gz" sub2api LICENSE README.md
            fi
          done
          (cd dist && sha256sum sub2api_*.tar.gz sub2api_*.zip > checksums.txt)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/sub2api_* dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "Sub2API ${GITHUB_REF_NAME}" --generate-notes

  image:
    needs: [backend-tests, backend-lint, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build metadata
        id: metadata
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yetianxingshi/sub2api:${{ github.ref_name }}
            ghcr.io/yetianxingshi/sub2api:stable
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.metadata.outputs.date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
